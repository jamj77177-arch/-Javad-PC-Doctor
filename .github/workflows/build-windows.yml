
name: Build Javad PC Doctor EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Javad_PC_Doctor" --icon "assets/JavadPCDoctor.ico" javad_pc_doctor.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Javad-PC-Doctor-Windows
          path: dist/Javad_PC_Doctor.exe
